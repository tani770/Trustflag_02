version: "2.0"
window_rules:
  - id: "ASYMPTOTIC_INEFFICIENCY_REGRESSION"
    description: "Code introduces nested iterations, hidden O(N^2) in-loop searches, or artificial sleep stalls."
    window_minutes: 1440
    min_event_count: 1
    conditions:
      - signal: "time_complexity"
        operator: "gte"
        threshold: 2.0
    action: "FLAG_COMPLEXITY_REGRESSION"
