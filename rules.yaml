version: "3.0"
window_rules:
  - id: "REQUIRE_100_PERCENT_ACCURACY"
    description: "Code must be 100% accurate. Any failed assertion, syntax error, or wrong output triggers immediate rejection."
    window_minutes: 1440
    min_event_count: 1
    conditions:
      - signal: "score"
        operator: "lt"
        threshold: 1.0
    action: "FLAG_INACCURATE_CODE"
